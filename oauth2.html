<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>بازگشت به مافیا وارتلو</title>
</head>
<body>
    <h3>در حال بازگشت به مافیا وارتلو...</h3>
    <p id="message">لطفاً کمی صبر کنید.</p>

    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        const state = params.get("state");
        const error = params.get("error");

        if (error) {
            document.getElementById("message").textContent =
                "ورود گوگل انجام نشد. به برنامه برگردید و دوباره تلاش کنید.";
        } else if (code && state) {
            const appUrl = "wartlo://oauth2-redirect"
                + "?code=" + encodeURIComponent(code)
                + "&state=" + encodeURIComponent(state);

            window.location.replace(appUrl);
        } else {
            document.getElementById("message").textContent =
                "اطلاعات بازگشت گوگل کامل نیست.";
        }
    </script>
</body>
</html>
